  </defs>
  <style>
    .rain { transform: translateY(var(--rest)); animation: fall var(--period) linear var(--phase) infinite; }
    .pulse { fill: none; stroke: #a3ffbe; stroke-width: 2.2; stroke-linecap: round; stroke-dasharray: 10 90; animation: flow var(--period, 4s) linear var(--phase, 0s) infinite; }
    @keyframes fall { from { transform: translateY(0); } to { transform: translateY(var(--end)); } }
    @keyframes flow { to { stroke-dashoffset: -100; } }

    @media (prefers-reduced-motion: reduce) {
      * { animation: none !important; }
    }
  </style>
