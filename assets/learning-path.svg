      <stop offset=".51" stop-color="#0a2016"/>
      <stop offset="1" stop-color="#06130d"/>
    </linearGradient>
    <pattern id="grid" width="18" height="18" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="1" fill="#58ae79" opacity=".39"/>
