<svg xmlns="http://www.w3.org/2000/svg" width="420" height="166" viewBox="0 0 420 166" role="img" aria-labelledby="title description">
  <title id="title">Developer Technology Trends</title>
  <desc id="description">An illustration of two dashboard charts.</desc>
  <defs>
    <clipPath id="panel"><rect x="1" y="1" width="418" height="164" rx="15"/></clipPath>
    <pattern id="grid" width="14" height="14" patternUnits="userSpaceOnUse">
      <path d="M14 .5H.5V14" stroke="#488f80" stroke-opacity=".11" fill="none"/>
    </pattern>
  </defs>
  <style>
    .column { transform-box: fill-box; transform-origin: center bottom; animation: chart 5s ease-in-out var(--lag, 0s) infinite; }
    @keyframes chart { 0%, 22%, 100% { transform: scaleY(1); } 11% { transform: scaleY(.6); } }

    @media (prefers-reduced-motion: reduce) {
      * { animation: none !important; }
    }
  </style>
  <g font-family="'Bricolage Grotesque', Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Liberation Sans', sans-serif">
    <g clip-path="url(#panel)">
      <rect width="420" height="166" rx="16" fill="#e6f4f0"/>
      <rect width="420" height="166" fill="url(#grid)"/>
      <rect x="80" y="25" width="260" height="116" rx="12" fill="#a9d6cc" opacity=".51" transform="translate(6 6)"/>
      <rect x="80" y="25" width="260" height="116" rx="12" fill="#fafffd" stroke="#7cb7aa" stroke-width="1.4"/>
      <path d="M80 49H340" stroke="#cbe6dd"/>
      <g fill="#589e8f"><circle cx="95" cy="37" r="2.1"/><circle cx="104" cy="37" r="2.1"/><circle cx="113" cy="37" r="2.1"/></g>
      <rect x="93" y="60" width="145" height="68" rx="6" fill="#e2f3ed"/>
      <path d="M108 72v43h118m-118-14h118m-118-14h118" fill="none" stroke="#a8cfc4" stroke-width="1"/>
      <g fill="#348b78">
        <rect class="column" x="120" y="92" width="13" height="23" rx="2"/>
        <rect class="column" x="142" y="98" width="13" height="17" rx="2" style="--lag:.25s" opacity=".74"/>
        <rect class="column" x="164" y="79" width="13" height="36" rx="2" style="--lag:.50s" opacity=".89"/>
        <rect class="column" x="186" y="89" width="13" height="26" rx="2" style="--lag:.75s" opacity=".74"/>
        <rect class="column" x="208" y="72" width="13" height="43" rx="2" style="--lag:1s"/>
      </g>
      <rect x="249" y="60" width="78" height="68" rx="6" fill="#e2f3ed"/>
      <path d="M261 99l10-7 11 3 10-12 11 2 12-10" fill="none" stroke="#318671" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M262 110h49m-49 6h35" stroke="#8abdaf" stroke-width="2.1" stroke-linecap="round"/>
      <path d="M61 47v14m-7-7h14m292 52v15m-7-7h14" stroke="#478c7d" stroke-width="1.4" stroke-linecap="round"/>
    </g>
    <rect x="1" y="1" width="418" height="164" rx="15" fill="none" stroke="#c2e3da"/>
  </g>
</svg>
