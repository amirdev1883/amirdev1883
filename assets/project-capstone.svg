<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 115" width="880" height="115" role="img" aria-labelledby="title">
  <title id="title">Developer Technology Trends</title>
  <defs>
    <linearGradient id="surface" x2="1" y2=".7">
      <stop stop-color="#101c2d"/>
      <stop offset=".48" stop-color="#112137"/>
      <stop offset="1" stop-color="#29264d"/>
    </linearGradient>
    <linearGradient id="frame" x2="1">
      <stop stop-color="#32465f"/>
      <stop offset="1" stop-color="#c1adff" stop-opacity=".53"/>
    </linearGradient>
    <pattern id="grid" width="15" height="15" patternUnits="userSpaceOnUse">
      <path d="M15 0H0V15" fill="none" stroke="#c1adff" stroke-opacity=".11"/>
      <circle cx="1" cy="1" r="1" fill="#c1adff" opacity=".18"/>
    </pattern>
    <linearGradient id="fade" x2="1">
      <stop stop-color="#000"/>
      <stop offset=".32" stop-color="#fff"/>
      <stop offset="1" stop-color="#fff"/>
    </linearGradient>
    <mask id="grid-mask" x="475" y="2" width="404" height="111" maskUnits="userSpaceOnUse">
      <rect x="475" y="2" width="404" height="111" fill="url(#fade)"/>
    </mask>
  </defs>
  <style>
    .pulse { animation: pulse 2.7s ease-in-out infinite alternate; }
    .scan { animation: scan 3.8s ease-in-out infinite; }
    .signal { stroke-dasharray: 8 205; animation: signal 2.9s linear infinite; }
    .late { animation-delay: -1.32s; }
    @keyframes pulse { from { opacity: .25; } to { opacity: 1; } }
    @keyframes scan {
      0% { transform: translateX(0); opacity: 0; }
      14%, 76% { opacity: .75; }
      93%, 100% { transform: translateX(177px); opacity: 0; }
    }
    @keyframes signal { from { stroke-dashoffset: 12; } to { stroke-dashoffset: -188; } }
    @media (prefers-reduced-motion: reduce) {
      .pulse, .scan, .signal { animation: none; }
      .signal, .scan { visibility: hidden; }
    }
  </style>

  <rect x="1" y="1" width="878" height="113" rx="15" fill="url(#surface)" stroke="url(#frame)" stroke-width="1.3"/>
  <rect x="2" y="2" width="876" height="111" rx="14" fill="url(#grid)" mask="url(#grid-mask)"/>
  <path d="M33 25h30" stroke="#c1adff" stroke-width="2.4" stroke-linecap="round"/>
  <text x="76" y="31" fill="#c1adff" font-family="'IBM Plex Mono', 'SFMono-Regular', Consolas, 'Liberation Mono', monospace" font-size="16" font-weight="650" letter-spacing="1.3">DATA ANALYTICS</text>
  <text x="32" y="79" fill="#eef5ff" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="36" font-weight="715" letter-spacing="-.62">Developer Technology Trends</text>

  <g transform="translate(611 21)" color="#c1adff" aria-hidden="true">
    <path d="M4 7v61h182M4 22h182M4 39h182M4 55h182" fill="none" stroke="#535c8d" stroke-opacity=".66"/>
    <g fill="currentColor" fill-opacity=".38" stroke="currentColor" stroke-opacity=".68">
      <rect x="14" y="44" width="15" height="24" rx="2"/>
      <rect x="41" y="29" width="15" height="39" rx="2"/>
      <rect x="68" y="37" width="15" height="31" rx="2"/>
      <rect x="95" y="13" width="15" height="55" rx="2"/>
      <rect x="122" y="21" width="15" height="47" rx="2"/>
      <rect x="149" y="9" width="15" height="59" rx="2"/>
    </g>
    <path d="m21 37 27-14 27 4 27-20 27 9 27-11 19 3" fill="none" stroke="#eee9ff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="175" cy="8" r="3.1" fill="#eee9ff" class="pulse"/>
    <path d="M9 4v64" class="scan" stroke="#e1d5ff" stroke-width="1.5"/>
  </g>
  <rect x="825" y="40" width="35" height="35" rx="8" fill="#0c192b" stroke="#c1adff" stroke-opacity=".55"/>
  <path d="m837 63 11-11m0 0h-8m8 0v8" fill="none" stroke="#c1adff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
