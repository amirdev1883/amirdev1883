<svg xmlns="http://www.w3.org/2000/svg" width="420" height="166" viewBox="0 0 420 166" role="img" aria-labelledby="title description">
  <title id="title">B2B Inventory Management</title>
  <desc id="description">Orders from two organizations connect to a shared inventory backend.</desc>
  <defs>
    <clipPath id="panel"><rect x="1" y="1" width="418" height="164" rx="15"/></clipPath>
    <pattern id="grid" width="14" height="14" patternUnits="userSpaceOnUse">
      <path d="M14 .5H.5V14" stroke="#9278c8" stroke-opacity=".11" fill="none"/>
    </pattern>
  </defs>
  <style>
    .packet { stroke-dasharray: 15 85; stroke-linecap: round; animation: route 3.8s linear var(--lag, 0s) infinite; }
    @keyframes route { to { stroke-dashoffset: -100; } }

    @media (prefers-reduced-motion: reduce) {
      * { animation: none !important; }
    }
  </style>
  <g font-family="'Bricolage Grotesque', Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Liberation Sans', sans-serif">
    <g clip-path="url(#panel)">
      <rect width="420" height="166" rx="16" fill="#f2edfc"/>
      <rect width="420" height="166" fill="url(#grid)"/>
      <g fill="none" stroke-width="1.6">
        <path d="M145 57h36l18 18h89M145 112h36l18-18h89" stroke="#9a88d0"/>
        <path class="packet" d="M145 57h36l18 18h89" pathLength="100" stroke="#684dba"/>
        <path class="packet" d="M145 112h36l18-18h89" pathLength="100" stroke="#684dba" style="--lag:-1.7s"/>
      </g>
      <g stroke="#9781c9" stroke-width="1.4">
        <rect x="82" y="34" width="69" height="46" rx="8" fill="#e7ddfc" transform="translate(4 4)" stroke="none"/>
        <rect x="82" y="89" width="69" height="46" rx="8" fill="#e7ddfc" transform="translate(4 4)" stroke="none"/>
        <rect x="82" y="34" width="69" height="46" rx="8" fill="#fbf7ff"/>
        <rect x="82" y="89" width="69" height="46" rx="8" fill="#fbf7ff"/>
      </g>
      <g fill="#876ccc">
        <path d="M101 52l9-4 9 4-9 4Zm0 2 8 4v8l-8-4Zm10 4 8-4v8l-8 4Z"/>
        <path d="M101 107l9-4 9 4-9 4Zm0 2 8 4v8l-8-4Zm10 4 8-4v8l-8 4Z"/>
      </g>
      <g fill="#62479e" font-size="12" font-weight="700" text-anchor="middle">
        <text x="133" y="61">A</text><text x="133" y="116">B</text>
      </g>
      <rect x="273" y="48" width="65" height="71" rx="10" fill="#b29cde" opacity=".43" transform="translate(5 5)"/>
      <rect x="273" y="48" width="65" height="71" rx="10" fill="#6c51ae"/>
      <path d="M285 66h41v15h-41Zm0 20h41v15h-41Z" fill="#e0d4f7" opacity=".95"/>
      <path d="M292 73h22m-22 20h22" stroke="#7257b1" stroke-width="2.1" stroke-linecap="round"/>
      <circle cx="320" cy="73" r="1.7" fill="#7257b1"/>
      <circle cx="320" cy="93" r="1.7" fill="#7257b1"/>
      <path d="M61 125v14m-7-7h14m291-101v15m-7-7h14" stroke="#8165bd" stroke-width="1.4" stroke-linecap="round"/>
    </g>
    <rect x="1" y="1" width="418" height="164" rx="15" fill="none" stroke="#ded0f4"/>
  </g>
</svg>
