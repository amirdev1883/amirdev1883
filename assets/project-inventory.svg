<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 115" width="880" height="115" role="img" aria-labelledby="title">
  <title id="title">B2B Inventory Management</title>
  <defs>
    <linearGradient id="surface" x2="1" y2=".7">
      <stop stop-color="#101c2d"/>
      <stop offset=".48" stop-color="#112137"/>
      <stop offset="1" stop-color="#382d2b"/>
    </linearGradient>
    <linearGradient id="frame" x2="1">
      <stop stop-color="#32465f"/>
      <stop offset="1" stop-color="#f0cb86" stop-opacity=".53"/>
    </linearGradient>
    <pattern id="grid" width="15" height="15" patternUnits="userSpaceOnUse">
      <path d="M15 0H0V15" fill="none" stroke="#f0cb86" stroke-opacity=".11"/>
      <circle cx="1" cy="1" r="1" fill="#f0cb86" opacity=".18"/>
    </pattern>
    <linearGradient id="fade" x2="1">
      <stop stop-color="#000"/>
      <stop offset=".32" stop-color="#fff"/>
      <stop offset="1" stop-color="#fff"/>
    </linearGradient>
    <mask id="grid-mask" x="475" y="2" width="404" height="111" maskUnits="userSpaceOnUse">
      <rect x="475" y="2" width="404" height="111" fill="url(#fade)"/>
    </mask>
  </defs>
  <style>
    .pulse { animation: pulse 2.7s ease-in-out infinite alternate; }
    .scan { animation: scan 3.8s ease-in-out infinite; }
    .signal { stroke-dasharray: 8 205; animation: signal 2.9s linear infinite; }
    .late { animation-delay: -1.32s; }
    @keyframes pulse { from { opacity: .25; } to { opacity: 1; } }
    @keyframes scan {
      0% { transform: translateX(0); opacity: 0; }
      14%, 76% { opacity: .75; }
      93%, 100% { transform: translateX(177px); opacity: 0; }
    }
    @keyframes signal { from { stroke-dashoffset: 12; } to { stroke-dashoffset: -188; } }
    @media (prefers-reduced-motion: reduce) {
      .pulse, .scan, .signal { animation: none; }
      .signal, .scan { visibility: hidden; }
    }
  </style>

  <rect x="1" y="1" width="878" height="113" rx="15" fill="url(#surface)" stroke="url(#frame)" stroke-width="1.3"/>
  <rect x="2" y="2" width="876" height="111" rx="14" fill="url(#grid)" mask="url(#grid-mask)"/>
  <path d="M33 25h30" stroke="#f0cb86" stroke-width="2.4" stroke-linecap="round"/>
  <text x="76" y="31" fill="#f0cb86" font-family="'IBM Plex Mono', 'SFMono-Regular', Consolas, 'Liberation Mono', monospace" font-size="16" font-weight="650" letter-spacing="1.3">SYSTEM DESIGN</text>
  <text x="32" y="79" fill="#eef5ff" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="36" font-weight="715" letter-spacing="-.62">B2B Inventory Management</text>

  <g transform="translate(611 21)" color="#f0cb86" aria-hidden="true">
    <g fill="none" stroke="currentColor" stroke-opacity=".44" stroke-width="1.4">
      <path d="M70 38H39V18H10m60 20H39v21H10m103-21h29V18h29m-58 20h29v21h29"/>
    </g>
    <g fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
      <path class="signal" d="M10 18h29v20h31m101 21h-29V38h-29"/>
      <path class="signal late" d="M10 59h29V38h31m101-20h-29v20h-29"/>
    </g>
    <g fill="#2d2a23" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round">
      <path d="m92 10 23 13v27L92 64 69 50V23z"/>
      <path d="m69 23 23 14 23-14M92 37v27M81 16l23 14v12"/>
    </g>
    <g fill="#302c25" stroke="currentColor" stroke-width="1.5">
      <rect x="0" y="11" width="14" height="14" rx="2.5"/>
      <rect x="0" y="52" width="14" height="14" rx="2.5"/>
      <rect x="168" y="11" width="14" height="14" rx="2.5"/>
      <rect x="168" y="52" width="14" height="14" rx="2.5"/>
    </g>
    <circle cx="92" cy="37" r="2.5" fill="#ffe3ac" class="pulse"/>
  </g>
  <rect x="825" y="40" width="35" height="35" rx="8" fill="#0c192b" stroke="#f0cb86" stroke-opacity=".55"/>
  <path d="m837 63 11-11m0 0h-8m8 0v8" fill="none" stroke="#f0cb86" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
