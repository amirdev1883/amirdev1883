<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 115" width="880" height="115" role="img" aria-labelledby="title">
  <title id="title">Task Manager API &amp; Dashboard</title>
  <defs>
    <linearGradient id="surface" x2="1" y2=".7">
      <stop stop-color="#101c2d"/>
      <stop offset=".48" stop-color="#112137"/>
      <stop offset="1" stop-color="#133c42"/>
    </linearGradient>
    <linearGradient id="frame" x2="1">
      <stop stop-color="#32465f"/>
      <stop offset="1" stop-color="#82e8ce" stop-opacity=".53"/>
    </linearGradient>
    <pattern id="grid" width="15" height="15" patternUnits="userSpaceOnUse">
      <path d="M15 0H0V15" fill="none" stroke="#82e8ce" stroke-opacity=".11"/>
      <circle cx="1" cy="1" r="1" fill="#82e8ce" opacity=".18"/>
    </pattern>
    <linearGradient id="fade" x2="1">
      <stop stop-color="#000"/>
      <stop offset=".32" stop-color="#fff"/>
      <stop offset="1" stop-color="#fff"/>
    </linearGradient>
    <mask id="grid-mask" x="475" y="2" width="404" height="111" maskUnits="userSpaceOnUse">
      <rect x="475" y="2" width="404" height="111" fill="url(#fade)"/>
    </mask>
  </defs>
  <style>
    .pulse { animation: pulse 2.7s ease-in-out infinite alternate; }
    .scan { animation: scan 3.8s ease-in-out infinite; }
    .signal { stroke-dasharray: 8 205; animation: signal 2.9s linear infinite; }
    .late { animation-delay: -1.32s; }
    @keyframes pulse { from { opacity: .25; } to { opacity: 1; } }
    @keyframes scan {
      0% { transform: translateX(0); opacity: 0; }
      14%, 76% { opacity: .75; }
      93%, 100% { transform: translateX(177px); opacity: 0; }
    }
    @keyframes signal { from { stroke-dashoffset: 12; } to { stroke-dashoffset: -188; } }
    @media (prefers-reduced-motion: reduce) {
      .pulse, .scan, .signal { animation: none; }
      .signal, .scan { visibility: hidden; }
    }
  </style>

  <rect x="1" y="1" width="878" height="113" rx="15" fill="url(#surface)" stroke="url(#frame)" stroke-width="1.3"/>
  <rect x="2" y="2" width="876" height="111" rx="14" fill="url(#grid)" mask="url(#grid-mask)"/>
  <path d="M33 25h30" stroke="#82e8ce" stroke-width="2.4" stroke-linecap="round"/>
  <text x="76" y="31" fill="#82e8ce" font-family="'IBM Plex Mono', 'SFMono-Regular', Consolas, 'Liberation Mono', monospace" font-size="16" font-weight="650" letter-spacing="1.3">BACKEND DEVELOPMENT</text>
  <text x="32" y="79" fill="#eef5ff" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="36" font-weight="715" letter-spacing="-.62">Task Manager API &amp; Dashboard</text>

  <g transform="translate(611 21)" color="#82e8ce" aria-hidden="true">
    <g fill="none" stroke="currentColor" stroke-width="1.3" stroke-opacity=".55">
      <path d="M44 37h27m48 0h27M10 13v-5h81v10m86 40v10h-80V55"/>
    </g>
    <g class="signal" fill="none" stroke="#b1ffe9" stroke-width="2.3" stroke-linecap="round">
      <path d="M45 37h25m50 0h25"/>
    </g>
    <g fill="#102f35" stroke="currentColor" stroke-width="1.4" stroke-opacity=".83">
      <rect x="0" y="19" width="44" height="36" rx="6"/>
      <rect x="71" y="19" width="48" height="36" rx="6"/>
      <path d="M146 26v23c0 8 39 8 39 0V26"/>
      <ellipse cx="165.5" cy="26" rx="19.5" ry="6.7"/>
    </g>
    <g fill="none" stroke="currentColor" stroke-width="1.65" stroke-linecap="round" stroke-linejoin="round">
      <path d="m13 31 6 6-6 6m10 0h8m53-12h22m-22 6h17m-17 6h10"/>
      <path d="M146 37c0 8 39 8 39 0m-39 6c0 8 39 8 39 0" stroke-opacity=".6"/>
    </g>
    <circle cx="91" cy="8" r="2.2" fill="currentColor" class="pulse"/>
    <circle cx="97" cy="68" r="2.2" fill="currentColor" class="pulse late"/>
  </g>
  <rect x="825" y="40" width="35" height="35" rx="8" fill="#0c192b" stroke="#82e8ce" stroke-opacity=".55"/>
  <path d="m837 63 11-11m0 0h-8m8 0v8" fill="none" stroke="#82e8ce" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
