<svg xmlns="http://www.w3.org/2000/svg" width="420" height="166" viewBox="0 0 420 166" role="img" aria-labelledby="title description">
  <title id="title">Task Manager API</title>
  <desc id="description">A task dashboard with three animated check marks.</desc>
  <defs>
    <clipPath id="panel"><rect x="1" y="1" width="418" height="164" rx="15"/></clipPath>
    <pattern id="grid" width="14" height="14" patternUnits="userSpaceOnUse">
      <path d="M14 .5H.5V14" stroke="#c38353" stroke-opacity=".11" fill="none"/>
    </pattern>
  </defs>
  <style>
    .check { stroke-dasharray: 100; animation: check 5.5s ease-out var(--lag, 0s) infinite; }
    @keyframes check {
      0%, 100% { stroke-dashoffset: 100; }
      12%, 87% { stroke-dashoffset: 0; }
    }

    @media (prefers-reduced-motion: reduce) {
      * { animation: none !important; }
    }
  </style>
  <g font-family="'Bricolage Grotesque', Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Liberation Sans', sans-serif">
    <g clip-path="url(#panel)">
      <rect width="420" height="166" rx="16" fill="#fff2e6"/>
      <rect width="420" height="166" fill="url(#grid)"/>
      <rect x="94" y="28" width="232" height="115" rx="13" fill="#e9b982" opacity=".37" transform="translate(6 6)"/>
      <rect x="94" y="28" width="232" height="115" rx="13" fill="#fffaf5" stroke="#dca577" stroke-width="1.4"/>
      <path d="M94 53H326" stroke="#eedbc9"/>
      <g fill="#bf784b"><circle cx="109" cy="41" r="2.2"/><circle cx="118" cy="41" r="2.2"/><circle cx="127" cy="41" r="2.2"/></g>
      <path d="M266 41h43" stroke="#d6a17d" stroke-width="3" stroke-linecap="round"/>
      <g fill="#fcf0e5">
        <rect x="109" y="63" width="201" height="19" rx="4"/>
        <rect x="109" y="87" width="201" height="19" rx="4"/>
        <rect x="109" y="111" width="201" height="19" rx="4"/>
      </g>
      <g fill="#fffaf5" stroke="#bb7148" stroke-width="1">
        <rect x="116" y="67" width="12" height="11" rx="2"/>
        <rect x="116" y="91" width="12" height="11" rx="2"/>
        <rect x="116" y="115" width="12" height="11" rx="2"/>
      </g>
      <g stroke="#ab5a36" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none">
        <path class="check" d="M119 72l2.5 2.5 5-6" pathLength="100"/>
        <path class="check" d="M119 96l2.5 2.5 5-6" pathLength="100" style="--lag:.46s"/>
        <path class="check" d="M119 120l2.5 2.5 5-6" pathLength="100" style="--lag:.92s"/>
      </g>
      <path d="M141 72h95m-95 25h119m-119 24h77" stroke="#bf8766" stroke-opacity=".74" stroke-width="3" stroke-linecap="round"/>
      <path d="M286 72h14m-14 25h14m-14 24h14" stroke="#d4a27e" stroke-width="2.5" stroke-linecap="round"/>
      <circle cx="335" cy="52" r="24" fill="#f2be93" opacity=".54" transform="translate(4 4)"/>
      <circle cx="335" cy="52" r="24" fill="#b35b36"/>
      <path d="M324 51l8 8 13-15" fill="none" stroke="#fff7ee" stroke-width="3.6" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M62 93v14m-7-7h14m293 23v14m-7-7h14" stroke="#c37343" stroke-width="1.4" stroke-linecap="round"/>
    </g>
    <rect x="1" y="1" width="418" height="164" rx="15" fill="none" stroke="#edcdb3"/>
  </g>
</svg>
