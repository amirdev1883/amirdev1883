        <circle r="12.5" fill="#2a4bb5" stroke="#ffd5a1" stroke-width="1.4"/>
        <text x="0" y="4.5" text-anchor="middle" fill="#fff" font-size="13" font-weight="700">A</text>
      </g>
      <g transform="translate(688 119)" style="--visit:0.57s">
        <circle class="halo" r="20"/>
