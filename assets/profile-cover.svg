      <text x="40" y="153" fill="#131f39" font-size="88" font-weight="750" letter-spacing="-5.3">Amir Arani</text>
      <text x="45" y="203" fill="#294dc9" font-size="29" font-weight="700">Computer science</text>
      <text x="46" y="239" fill="#3b4b69" font-size="22">Software development · Data analytics</text>

      <path d="M45 281h16m-8-8v16m15-8h100" stroke="#4763bd" stroke-width="1.2" stroke-linecap="round"/>
