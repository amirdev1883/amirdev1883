<svg xmlns="http://www.w3.org/2000/svg" width="960" height="314" viewBox="0 0 960 314" role="img" aria-labelledby="title description">
  <title id="title">Amir Arani · Computer Science</title>
  <desc id="description">A breadth-first search visits nodes A, B, C, D, E, F, G, and H in order.</desc>
  <defs>
    <clipPath id="paper"><rect x="1" y="1" width="958" height="312" rx="25"/></clipPath>
    <linearGradient id="paper-color" x2="1" y2="1">
      <stop stop-color="#fffdf8"/>
      <stop offset="1" stop-color="#eeeef6"/>
    </linearGradient>
    <linearGradient id="blue" x2="1" y2="1">
      <stop stop-color="#345be7"/>
      <stop offset=".57" stop-color="#2846b6"/>
      <stop offset="1" stop-color="#1d348d"/>
    </linearGradient>
    <pattern id="grid" width="18" height="18" patternUnits="userSpaceOnUse">
      <path d="M18 .5H.5V18" stroke="#bfd2ff" stroke-opacity=".13" fill="none"/>
    </pattern>
    <pattern id="paper-grid" width="14" height="14" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="1" fill="#4059a4" opacity=".13"/>
    </pattern>
    <clipPath id="search-panel"><rect x="560" y="14" width="386" height="286" rx="17"/></clipPath>
  </defs>
  <style>
    .edge { fill: none; stroke: #b7caff; stroke-width: 1.4; stroke-opacity: .52; }
    .trace { fill: none; stroke: #ffd1a0; stroke-width: 2.6; stroke-linecap: round; stroke-dasharray: 100; stroke-dashoffset: 100; animation: trace 8s linear var(--visit) infinite; }
    .halo { fill: none; stroke: #ffca92; stroke-width: 2; opacity: .16; animation: visit 8s ease-out var(--visit) infinite; }
    .order { fill: #d6e0ff; animation: order 8s ease-out var(--visit) infinite; }
    @keyframes trace {
      0% { stroke-dashoffset: 100; opacity: 0; }
      7%, 23% { stroke-dashoffset: 0; opacity: 1; }
      54%, 100% { stroke-dashoffset: 0; opacity: 0; }
    }
    @keyframes visit {
      0%, 48%, 100% { opacity: .16; }
      7%, 21% { opacity: 1; }
    }
    @keyframes order {
      0%, 53%, 100% { fill: #d6e0ff; }
      7%, 34% { fill: #ffce99; }
    }

    @media (prefers-reduced-motion: reduce) {
      * { animation: none !important; }
    }
  </style>
  <g font-family="'Bricolage Grotesque', Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Liberation Sans', sans-serif">
    <g clip-path="url(#paper)">
      <rect width="960" height="314" fill="url(#paper-color)"/>
      <path d="M1 259H560V314H1Z" fill="url(#paper-grid)"/>
      <path d="M39 60H516" stroke="#cfd6ea"/>
      <path d="M44 61h75" stroke="#3157d5" stroke-width="3"/>
