        <circle r="12.5" fill="#2a4bb5" stroke="#a6bdff" stroke-width="1.4"/>
        <text x="0" y="4.5" text-anchor="middle" fill="#fff" font-size="13" font-weight="700">G</text>
      </g>
      <g transform="translate(884 166)" style="--visit:3.99s">
        <circle class="halo" r="20"/>
        <circle r="12.5" fill="#2a4bb5" stroke="#a6bdff" stroke-width="1.4"/>
        <text x="0" y="4.5" text-anchor="middle" fill="#fff" font-size="13" font-weight="700">H</text>
      </g>
        <text x="584" y="281" fill="#d6e0ff" font-size="11" font-family="'Space Mono', 'SFMono-Regular', Consolas, 'Liberation Mono', monospace" letter-spacing="1.05">VISIT ORDER</text>
        <g font-family="'Space Mono', 'SFMono-Regular', Consolas, 'Liberation Mono', monospace" font-size="13" font-weight="700">
