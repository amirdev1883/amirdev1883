        <circle r="12.5" fill="#2a4bb5" stroke="#a6bdff" stroke-width="1.4"/>
        <text x="0" y="4.5" text-anchor="middle" fill="#fff" font-size="13" font-weight="700">F</text>
      </g>
      <g transform="translate(782 245)" style="--visit:3.42s">
