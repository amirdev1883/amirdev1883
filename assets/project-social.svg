<svg xmlns="http://www.w3.org/2000/svg" width="420" height="166" viewBox="0 0 420 166" role="img" aria-labelledby="title description">
  <title id="title">Django Social Media</title>
  <desc id="description">A profile feed and an animated reply bubble.</desc>
  <defs>
    <clipPath id="panel"><rect x="1" y="1" width="418" height="164" rx="15"/></clipPath>
    <pattern id="grid" width="14" height="14" patternUnits="userSpaceOnUse">
      <path d="M14 .5H.5V14" stroke="#5476c9" stroke-opacity=".11" fill="none"/>
    </pattern>
  </defs>
  <style>
    .reply { animation: reply 4s ease-in-out var(--lag, 0s) infinite; }
    @keyframes reply { 0%, 26%, 100% { transform: translateY(0); } 13% { transform: translateY(-6px); } }

    @media (prefers-reduced-motion: reduce) {
      * { animation: none !important; }
    }
  </style>
