<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 115" width="880" height="115" role="img" aria-labelledby="title">
  <title id="title">Django Social Media</title>
  <defs>
    <linearGradient id="surface" x2="1" y2=".7">
      <stop stop-color="#101c2d"/>
      <stop offset=".48" stop-color="#112137"/>
      <stop offset="1" stop-color="#152e4e"/>
    </linearGradient>
    <linearGradient id="frame" x2="1">
      <stop stop-color="#32465f"/>
      <stop offset="1" stop-color="#8fd5ff" stop-opacity=".53"/>
    </linearGradient>
    <pattern id="grid" width="15" height="15" patternUnits="userSpaceOnUse">
      <path d="M15 0H0V15" fill="none" stroke="#8fd5ff" stroke-opacity=".11"/>
      <circle cx="1" cy="1" r="1" fill="#8fd5ff" opacity=".18"/>
    </pattern>
    <linearGradient id="fade" x2="1">
      <stop stop-color="#000"/>
      <stop offset=".32" stop-color="#fff"/>
      <stop offset="1" stop-color="#fff"/>
    </linearGradient>
    <mask id="grid-mask" x="475" y="2" width="404" height="111" maskUnits="userSpaceOnUse">
      <rect x="475" y="2" width="404" height="111" fill="url(#fade)"/>
    </mask>
  </defs>
  <style>
    .pulse { animation: pulse 2.7s ease-in-out infinite alternate; }
    .scan { animation: scan 3.8s ease-in-out infinite; }
    .signal { stroke-dasharray: 8 205; animation: signal 2.9s linear infinite; }
    .late { animation-delay: -1.32s; }
    @keyframes pulse { from { opacity: .25; } to { opacity: 1; } }
    @keyframes scan {
      0% { transform: translateX(0); opacity: 0; }
      14%, 76% { opacity: .75; }
      93%, 100% { transform: translateX(177px); opacity: 0; }
    }
    @keyframes signal { from { stroke-dashoffset: 12; } to { stroke-dashoffset: -188; } }
    @media (prefers-reduced-motion: reduce) {
      .pulse, .scan, .signal { animation: none; }
      .signal, .scan { visibility: hidden; }
    }
  </style>

  <rect x="1" y="1" width="878" height="113" rx="15" fill="url(#surface)" stroke="url(#frame)" stroke-width="1.3"/>
  <rect x="2" y="2" width="876" height="111" rx="14" fill="url(#grid)" mask="url(#grid-mask)"/>
  <path d="M33 25h30" stroke="#8fd5ff" stroke-width="2.4" stroke-linecap="round"/>
  <text x="76" y="31" fill="#8fd5ff" font-family="'IBM Plex Mono', 'SFMono-Regular', Consolas, 'Liberation Mono', monospace" font-size="16" font-weight="650" letter-spacing="1.3">WEB DEVELOPMENT</text>
  <text x="32" y="79" fill="#eef5ff" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="36" font-weight="715" letter-spacing="-.62">Django Social Media</text>

  <g transform="translate(611 21)" color="#8fd5ff" aria-hidden="true">
    <g fill="none" stroke="currentColor" stroke-width="1.3" stroke-opacity=".48">
      <path d="M90 36 12 22m78 14L40 65m50-29 47-28M90 36l76 14M12 22l28 43 126-15-29-42L12 22"/>
    </g>
    <g fill="none" stroke="#b4ebff" stroke-width="2.2" stroke-linecap="round">
      <path class="signal" d="M12 22l78 14 76 14"/>
      <path class="signal late" d="m137 8-47 28-50 29"/>
    </g>
    <g fill="#142b47" stroke="currentColor" stroke-width="1.7">
      <circle cx="12" cy="22" r="6"/>
      <circle cx="40" cy="65" r="6"/>
      <circle cx="137" cy="8" r="6"/>
      <circle cx="166" cy="50" r="6"/>
      <circle cx="90" cy="36" r="20"/>
    </g>
    <g fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round">
      <circle cx="90" cy="32" r="4.8"/>
      <path d="M81 44c1-3 4-5 9-5s8 2 9 5"/>
    </g>
    <circle cx="90" cy="36" r="25" fill="none" stroke="#a1e1ff" stroke-dasharray="2 4" class="pulse"/>
  </g>
  <rect x="825" y="40" width="35" height="35" rx="8" fill="#0c192b" stroke="#8fd5ff" stroke-opacity=".55"/>
  <path d="m837 63 11-11m0 0h-8m8 0v8" fill="none" stroke="#8fd5ff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
